# User authorized binding idle devices; this daemon owns only cb.
grpc:
  endpoint: "127.0.0.1:50173"
accelerators:
  - accel_id: 0
    view_root: "/home/byh/hisparse_io/build/tutti-cb-view"
nvmes:
  - device_id: 0
    pci_addr: "0000:cb:00.0"
    backing_mount_path: "/mnt/hisparse_io"
    namespace_id: 1
    kernel_ioq_cap: 32
    allowed_accel_ids: [0]
    auto_mount: true
queue_pool:
  default_per_client: 16
  max_per_client: 16
lease:
  heartbeat_interval_sec: 10
  timeout_sec: 120
unmount_retry:
  interval_ms: 1000
  max: 30
